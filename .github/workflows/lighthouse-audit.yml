name: Lighthouse mobile lab and real-host acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'research/seo-21-editorial-decisions.json'
      - 'package.json'
      - '.github/workflows/lighthouse-audit.yml'
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Leave empty for local noindex preview; for live testing enter the actual independent-site HTTPS origin'
        required: false
        type: string
      expected_indexing:
        description: 'true only for the approved, publicly indexed final host'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build local preview or verify provided live hostname
        env:
          AUDIT_HOST: ${{ inputs.site_url }}
          AUDIT_EXPECT_INDEX: ${{ inputs.expected_indexing }}
        run: |
          set -euo pipefail
          if [ -z "$AUDIT_HOST" ]; then
            npm run build
            python3 -m http.server --bind 127.0.0.1 4173 --directory dist >/tmp/grams-cups-lighthouse-http.log 2>&1 &
            for attempt in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS http://127.0.0.1:4173/ >/dev/null
          else
            LIVE_SITE_URL="$AUDIT_HOST" LIVE_EXPECT_INDEX="$AUDIT_EXPECT_INDEX" npm run smoke:live
          fi
      - name: Install one-off Lighthouse CLI (not included in site bundle)
        run: |
          npm install --global lighthouse@13.6.0
          command -v google-chrome-stable || command -v google-chrome || command -v chromium
          lighthouse --version
      - name: Measure representative mobile pages and verify accessible UX
        env:
          LIGHTHOUSE_SITE_URL: ${{ inputs.site_url }}
          LIGHTHOUSE_EXPECT_PUBLIC: ${{ inputs.expected_indexing }}
        run: node scripts/lighthouse-runner.mjs
      - name: Upload Lighthouse JSON reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grams-cups-mobile-lighthouse
          path: reports/lighthouse/
          retention-days: 30
          if-no-files-found: warn
